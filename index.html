<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Nick Barricelli - IT professional specializing in infrastructure, networking, endpoint management, and enterprise technology.">

    <title>Nick Barricelli Contact Card</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Font Awesome for icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <main class="card">

        <img
            src="assets/profile.jpg"
            alt="Nick Barricelli"
            class="profile-photo"
        >

        <h1>Nick Barricelli</h1>

        <p class="title">
            IT Professional
        </p>

        <p class="specialties">
            Infrastructure • Networking • Endpoint Management
        </p>

        <p class="bio">
            IT professional focused on enterprise infrastructure,
            networking, endpoint management, and modern Microsoft technologies.
        </p>

        <div class="links">

            <a
                href="https://www.linkedin.com/in/nickbarricelli/"
                target="_blank"
                rel="noopener noreferrer"
                class="link-button"
            >
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

            <a
                href="https://github.com/NBarricelli/"
                target="_blank"
                rel="noopener noreferrer"
                class="link-button"
            >
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

            <a
                href="mailto:nick@barricel.li"
                class="link-button"
            >
                <i class="fa-solid fa-envelope"></i>
                <span>Email Me</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a
                href="Nick-Barricelli.vcf"
                download
                class="link-button"
            >
                <i class="fa-solid fa-address-card"></i>
                <span>Add to Contacts</span>
                <i class="fa-solid fa-download arrow"></i>
            </a>

        </div>

        <div class="social-links">

            <a
                href="https://www.linkedin.com/in/nickbarricelli/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
            >
                <i class="fa-brands fa-linkedin"></i>
            </a>

            <a
                href="https://github.com/NBarricelli/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
            >
                <i class="fa-brands fa-github"></i>
            </a>

            <a
                href="mailto:nick@barricel.li"
                aria-label="Email"
            >
                <i class="fa-solid fa-envelope"></i>
            </a>

        </div>

        <footer>
            nick.barricel.li
        </footer>

    </main>

</body>
</html>
